name: Arcana checks
on:
  push:
    branches: [main, tarot-rebuild]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check account.js
          node --check worker/src/index.js
      - name: Verify app assets
        run: |
          test -s index.html
          test -s app.js
          test -s account.js
          grep -q 'src="app.js"' index.html
          grep -q 'src="account.js"' index.html
          grep -q 'privacy.html' index.html
